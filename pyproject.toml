[project]
name = "music_app"
version = "0.1.0"
description = "A unified YouTube Music controller featuring MCP, CLI, and NiceGUI interfaces."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ytmusicapi>=1.12.0",
    "typer>=0.12.0",
    "nicegui>=1.4.0",
    "fastmcp>=0.1.0",
    "pydantic>=2.0",
    "python-mpv-jsonipc>=1.0.0"
]

[project.scripts]
music = "music_app.cli:app"
music-mcp = "music_app.mcp_server:main"
music-ui = "music_app.app:main"

[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"
